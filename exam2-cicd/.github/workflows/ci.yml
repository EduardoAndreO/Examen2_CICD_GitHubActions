# ============================================================
# ci.yml - Actividad 2: Pipeline de Integración Continua
# Triggers: push a main + pull_request
# Jobs: lint → test → coverage
# Matrix: Node.js 18.x y 20.x
# Cache: npm
# ============================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- JOB 1: LINT ----
  lint:
    name: "Lint | Node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]   # Matrix: mínimo 2 versiones de Node.js
      fail-fast: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'               # Cache de npm para mejorar velocidad

      - name: Instalar dependencias
        run: npm ci                  # Instalación limpia usando package-lock.json

      - name: Ejecutar ESLint
        run: npm run lint

  # ---- JOB 2: TEST ----
  test:
    name: "Test | Node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    needs: lint                      # Depende del job lint
    strategy:
      matrix:
        node-version: [18.x, 20.x]
      fail-fast: false

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

  # ---- JOB 3: COVERAGE ----
  coverage:
    name: "Coverage Report"
    runs-on: ubuntu-latest
    needs: test                      # Depende del job test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar reporte de cobertura
        run: npm run coverage

      - name: Subir artefacto de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
